# Local telemetry backends for open-delivery-gear on your Mac.
# Copied from service-provider-odg/local-telemetry/compose.yml (newer version).
# Started/stopped by ../logs-on.sh — no need to touch directly.
name: odg-telemetry

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"        # lab: no TLS/auth — the chart's
                                             # opensearch exporter talks plain http
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    networks: [lab]

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.2
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on: [opensearch]
    networks: [lab]

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Prometheus SCRAPES the in-cluster collector :8889 via kubectl port-forward
      # (opened by logs-on.sh). No remote-write receiver.
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [lab]

networks:
  lab:
