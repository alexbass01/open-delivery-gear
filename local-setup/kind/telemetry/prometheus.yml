# Mac-side Prometheus scrapes the in-cluster collector through the kubectl
# port-forward that logs-on.sh opens (localhost:8889 -> collector :8889).
# Copied from service-provider-odg/local-telemetry/prometheus.yml.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      # host.docker.internal = the Mac, where the port-forward is bound.
      - targets: [host.docker.internal:8889]
